<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>eFootball Liga</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080d0f;--card:#10181b;--card2:#151f22;--line:#263337;--text:#f4f7f7;--muted:#8e9a9e;--green:#35d07f;--green2:#1da95e;--red:#ff5c6c;--yellow:#f4c95d;--blue:#4da3ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18352b 0,#0a1012 38%,var(--bg) 75%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:720px;margin:auto;padding:14px 14px 90px}.hero{background:linear-gradient(145deg,#14231f,#0e1517);border:1px solid #263c35;border-radius:26px;padding:20px;box-shadow:0 12px 40px #0008}.brand{display:flex;align-items:center;gap:14px}.ball{width:54px;height:54px;border-radius:18px;background:#0a1110;display:grid;place-items:center;font-size:30px;border:1px solid #2a493c}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.profile{margin-top:18px;background:#0b1214;border:1px solid var(--line);border-radius:18px;padding:14px}.profile b{font-size:17px}.profile span{color:var(--muted);font-size:13px}.deadline{margin-top:12px;display:flex;justify-content:space-between;align-items:center;background:#13251e;border:1px solid #214f3b;border-radius:14px;padding:11px 13px}.deadline small{color:#9ab6aa}.deadline strong{color:var(--green)}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.nav button,.adminBtn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:15px 12px;text-align:left;font-weight:700}.nav button:active,.adminBtn:active{transform:scale(.98)}.nav .active{border-color:#2f9c69;background:#11231c}.section{margin-top:14px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.sectionTitle h2{font-size:18px;margin:0}.muted{color:var(--muted)}.card{background:rgba(16,24,27,.96);border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0}.game{background:linear-gradient(145deg,#121c1f,#0d1416);border:1px solid var(--line);border-radius:22px;padding:15px;margin:11px 0}.gameHead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.teams{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;text-align:center;gap:8px;margin:15px 0}.teamSide{min-width:0}.logo{width:54px;height:54px;object-fit:contain;display:block;margin:0 auto 7px}.teamName{font-weight:800;font-size:13px;line-height:1.2}.owner{color:var(--muted);font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vs{font-size:14px;color:var(--muted);font-weight:800}.score{font-size:27px;font-weight:900}.status{display:inline-flex;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:800}.s-green{background:#123622;color:#63e09c}.s-yellow{background:#392f12;color:#f5d86e}.s-red{background:#3b171d;color:#ff8791}.s-blue{background:#122c45;color:#70b9ff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;padding:11px 12px;border-radius:13px;background:#1b292d;color:white;font-weight:800;border:1px solid #2c3b3f}.btn.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#04140b;border:0}.btn.danger{background:#35181e;color:#ff9ba4}.btn:disabled{opacity:.45}.scoreForm{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:7px;margin-top:10px}.scoreForm input,.form input,.form select{width:100%;background:#0a1113;color:white;border:1px solid #304045;border-radius:12px;padding:11px;outline:none}.scoreForm input{text-align:center}.form{display:grid;gap:8px}.form label{font-size:12px;color:var(--muted)}.tableWrap{overflow:auto;border-radius:15px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:540px;background:#0e1517}th,td{padding:10px 7px;border-bottom:1px solid #223034;text-align:center;font-size:12px}th{color:#9eabad;background:#131d20;position:sticky;top:0}.club{display:flex;align-items:center;gap:8px;text-align:left}.club img{width:30px;height:30px;object-fit:contain}.ownerCell{color:var(--muted);font-size:10px}.teamGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.teamCard{background:#111a1d;border:1px solid var(--line);border-radius:17px;padding:12px;text-align:center}.teamCard img{width:55px;height:55px;object-fit:contain}.teamCard b{display:block;font-size:12px;margin-top:7px}.teamCard small{display:block;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.back{margin-top:10px;background:transparent;color:#9fb0b4;padding:7px}.adminBtn{display:block;width:100%;margin-top:10px;border-color:#5a4720;background:#211b0e;color:#f2cf70}.adminBlock{margin-top:12px}.adminRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.adminRow>*{flex:1}.tiny{font-size:10px;color:var(--muted)}.chat{position:fixed;inset:0;background:#070b0c;z-index:20;display:none;flex-direction:column}.chatTop{padding:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#0d1517}.chatTop button{background:#172226;color:white;border-radius:10px;padding:8px 12px}.chatTitle{font-weight:900}.chatBody{flex:1;overflow:auto;padding:14px}.bubble{max-width:82%;padding:9px 11px;border-radius:15px;background:#182226;margin:7px 0}.bubble.me{margin-left:auto;background:#164d34}.bubble small{display:block;color:#a6b0b3;font-size:9px;margin-bottom:3px}.chatSend{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;background:#0d1517}.chatSend input{flex:1;background:#111c20;color:white;border:1px solid #2d3b40;border-radius:13px;padding:11px}.chatSend button{background:var(--green);border-radius:13px;padding:0 16px;font-weight:900}.toast{position:fixed;left:14px;right:14px;bottom:20px;z-index:50;background:#172226;border:1px solid #34474c;border-radius:14px;padding:12px;text-align:center;display:none;box-shadow:0 10px 30px #0009}.hidden{display:none!important}@media(max-width:420px){.nav{gap:8px}.nav button{font-size:13px}.teamGrid{grid-template-columns:1fr 1fr}.teams{grid-template-columns:1fr 58px 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand"><div class="ball">⚽</div><div><h1>EFOOTBALL LIGA</h1><p>Raqobat • Tartib • G'alaba</p></div></div>
    <div class="profile"><b id="welcome">Xush kelibsiz!</b><br><span id="myTeam">Jamoa tanlanmagan</span></div>
    <div class="deadline"><small>⏰ Bugungi deadline</small><strong id="deadline">23:30</strong></div>
  </div>

  <div class="nav" id="mainNav">
    <button class="active" onclick="showSection('games',this)">🎮 Mening o'yinlarim</button>
    <button onclick="showSection('teams',this)">⚽ Jamoalar</button>
    <button onclick="showSection('standings',this)">🏆 Turnir jadvali</button>
    <button onclick="showSection('results',this)">📋 Natijalar</button>
  </div>
  <button id="adminButton" class="adminBtn hidden" onclick="showAdmin()">👑 Admin panel</button>

  <div id="games" class="section"></div>
  <div id="teams" class="section hidden"></div>
  <div id="standings" class="section hidden"></div>
  <div id="results" class="section hidden"></div>
  <div id="admin" class="section hidden"></div>
</div>

<div id="chat" class="chat">
  <div class="chatTop"><button onclick="closeChat()">←</button><div><div class="chatTitle" id="chatTitle">O'yin chat</div><div class="tiny">Faqat shu ikki raqib ko'radi</div></div></div>
  <div class="chatBody" id="chatBody"></div>
  <div class="chatSend"><input id="chatInput" placeholder="Xabar yozing..." maxlength="1000" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">➤</button></div>
</div>
<div id="toast" class="toast"></div>

<script>
const tg=window.Telegram.WebApp; tg.ready(); tg.expand();
let me=null,isAdmin=false,currentChat=null,chatTimer=null,teamsCache=[];
const $=id=>document.getElementById(id);
function toast(msg){$('toast').innerText=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
async function api(url,opt={}){opt.headers=Object.assign({'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData||''},opt.headers||{});let r=await fetch(url,opt);let d=await r.json().catch(()=>({ok:false,error:'Server javobi noto\'g\'ri'}));if(!r.ok&&d.error)throw Error(d.error);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showSection(id,btn){['games','teams','standings','results','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('#mainNav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='games')loadGames();if(id==='teams')loadTeams();if(id==='standings')loadStandings();if(id==='results')loadResults()}
async function loadMe(){try{let d=await api('/api/me');me=d.user;isAdmin=d.is_admin;$('welcome').innerText='Salom, '+(me.first_name||'Foydalanuvchi')+'!';$('myTeam').innerText=me.team_name?'⚽ '+me.team_name+(me.username?'  •  @'+me.username:''):'⚠️ Avval jamoa tanlang';$('adminButton').classList.toggle('hidden',!isAdmin);loadGames()}catch(e){toast(e.message)}}
function statusInfo(m){if(m.status==='official')return ['Rasmiy','s-green'];if(m.status==='pending')return ['Tasdiqlash kutilmoqda','s-yellow'];if(m.status==='auto')return ['23:30 • Avtomatik 0:0','s-blue'];return ['O‘ynalmagan','s-red']}
function gameCard(m){let [st,cls]=statusInfo(m),score=m.status==='pending'?(m.pending_home_goals+' : '+m.pending_away_goals):(m.home_goals+' : '+m.away_goals);let canConfirm=m.can_confirm;let html=`<div class="game"><div class="gameHead"><b>🏁 ${m.round_no}-TUR</b><span>${esc(m.round_date)} • ⏰ ${esc(m.deadline)}</span></div><div style="margin-top:7px"><span class="status ${cls}">${st}</span> ${m.scheduled_at?'<span class="tiny">  🎮 '+esc(m.scheduled_at)+'</span>':''}</div><div class="teams"><div class="teamSide"><img class="logo" src="${m.home_logo}"><div class="teamName">${esc(m.home)}</div><div class="owner">${m.home_username?'@'+esc(m.home_username):esc(m.home_username||'Ishtirokchi yo‘q')}</div></div><div class="vs">${m.status==='scheduled'?'VS':'<div class="score">'+score+'</div>'}</div><div class="teamSide"><img class="logo" src="${m.away_logo}"><div class="teamName">${esc(m.away)}</div><div class="owner">${m.away_username?'@'+esc(m.away_username):esc(m.away_username||'Ishtirokchi yo‘q')}</div></div></div>`;
if(m.status==='scheduled'){html+=`<div class="scoreForm"><input id="hg-${m.id}" type="number" min="0" max="99" placeholder="0"><b style="text-align:center">:</b><input id="ag-${m.id}" type="number" min="0" max="99" placeholder="0"></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="submitResult(${m.id})">📤 Natijani yuborish</button><button class="btn" onclick="openChat(${m.id},'${esc(m.home)} – ${esc(m.away)}')">💬 O‘yin chat</button></div>`}
else if(m.status==='pending'){html+=`<div class="actions" style="margin-top:8px"><button class="btn" onclick="openChat(${m.id},'${esc(m.home)} – ${esc(m.away)}')">💬 O‘yin chat</button>${canConfirm?`<button class="btn primary" onclick="confirmResult(${m.id})">✅ Hisobni tasdiqlash</button>`:`<button class="btn" disabled>⏳ Raqib tasdig‘i</button>`}</div>`;if(canConfirm)html+=`<button class="btn danger" style="margin-top:8px" onclick="rejectResult(${m.id})">❌ Natijani rad etish</button>`}
else{html+=`<div class="actions" style="margin-top:8px"><button class="btn" onclick="openChat(${m.id},'${esc(m.home)} – ${esc(m.away)}')">💬 O‘yin chat</button></div>`}return html+'</div>'}
async function loadGames(){try{let d=await api('/api/my_matches');$('deadline').innerText=d.matches[0]?.deadline||'23:30';let a=d.matches;if(!a.length){$('games').innerHTML='<div class="card empty">🎮 Hali sizga o‘yinlar biriktirilmagan.<br><br>Admin turlarni yaratgach shu yerda raqibingiz ko‘rinadi.</div>';return}let today=new Date().toISOString().slice(0,10);a.sort((x,y)=>x.round_no-y.round_no);let todayA=a.filter(x=>x.round_date===today);let rest=a.filter(x=>x.round_date!==today);$('games').innerHTML='<div class="sectionTitle"><h2>🎮 Bugungi o‘yinlar</h2><span class="muted">2 tur</span></div>'+(todayA.length?todayA.map(gameCard).join(''):'<div class="card empty">Bugun o‘yin yo‘q.</div>')+'<div class="sectionTitle"><h2>📅 Boshqa turlar</h2></div>'+rest.map(gameCard).join('')}catch(e){$('games').innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}}
async function submitResult(id){let hg=Number($('hg-'+id).value),ag=Number($('ag-'+id).value);if(!Number.isInteger(hg)||!Number.isInteger(ag)||hg<0||ag<0){toast('Hisobni kiriting');return}try{let d=await api('/api/result/submit',{method:'POST',body:JSON.stringify({match_id:id,home_goals:hg,away_goals:ag})});toast(d.message||'Natija yuborildi');loadGames()}catch(e){toast(e.message)}}
async function confirmResult(id){try{await api('/api/result/confirm',{method:'POST',body:JSON.stringify({match_id:id})});toast('✅ Natija rasmiylashtirildi');loadGames()}catch(e){toast(e.message)}}
async function rejectResult(id){try{await api('/api/result/reject',{method:'POST',body:JSON.stringify({match_id:id})});toast('Natija rad etildi');loadGames()}catch(e){toast(e.message)}}
async function loadTeams(){let d=await api('/api/teams');teamsCache=d;$('teams').innerHTML='<div class="sectionTitle"><h2>⚽ Jamoalar</h2><span class="muted">20 jamoa</span></div><div class="teamGrid">'+d.map(t=>`<div class="teamCard"><img src="${t.logo}"><b>${esc(t.name)}</b><small>${t.taken?(t.owner?'@'+esc(t.owner):'Band'):'Bo‘sh'}</small></div>`).join('')+'</div>'+(me&&!me.team_id?'<div class="card"><h3>Jamoa tanlang</h3><p class="muted">Bo‘sh jamoani tanlang.</p>'+d.filter(x=>!x.taken).map(t=>`<button class="btn primary" style="margin:4px 0" onclick="joinTeam(${t.id})">${esc(t.name)}</button>`).join('')+'</div>':'')}
async function joinTeam(id){try{await api('/api/join',{method:'POST',body:JSON.stringify({team_id:id})});toast('✅ Jamoa tanlandi');await loadMe();loadTeams()}catch(e){toast(e.message)}}
async function loadStandings(){let d=await api('/api/standings');$('standings').innerHTML='<div class="sectionTitle"><h2>🏆 Turnir jadvali</h2><span class="muted">3 ochko • 1 ochko</span></div><div class="tableWrap"><table><thead><tr><th>#</th><th>Jamoa</th><th>O</th><th>G</th><th>D</th><th>M</th><th>+/-</th><th>Ochk</th></tr></thead><tbody>'+d.map(t=>`<tr><td><b>${t.rank}</b></td><td><div class="club"><img src="${t.logo}"><div><b>${esc(t.name)}</b><div class="ownerCell">${t.owner?'@'+esc(t.owner):'—'}</div></div></div></td><td>${t.played}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gd}</td><td><b>${t.points}</b></td></tr>`).join('')+'</tbody></table></div>'}
async function loadResults(){let d=await api('/api/results');$('results').innerHTML='<div class="sectionTitle"><h2>📋 Natijalar</h2></div>'+(d.length?d.map(m=>`<div class="card"><div class="gameHead"><b>${m.round_no}-TUR</b><span>${esc(m.round_date)}</span></div><div class="teams"><div><img class="logo" src="${m.home_logo}"><b>${esc(m.home)}</b></div><div class="score">${m.home_goals}:${m.away_goals}</div><div><img class="logo" src="${m.away_logo}"><b>${esc(m.away)}</b></div></div><div class="muted" style="text-align:center;font-size:11px">${m.status==='auto'?'⏰ Deadline tugadi — avtomatik 0:0':'✅ Rasmiy natija'}</div></div>`).join(''):'<div class="card empty">Hali natijalar yo‘q.</div>')}
async function openChat(id,title){currentChat=id;$('chatTitle').innerText=title;$('chat').style.display='flex';await loadChat();clearInterval(chatTimer);chatTimer=setInterval(loadChat,3000);setTimeout(()=>$('chatInput').focus(),100)}
function closeChat(){clearInterval(chatTimer);currentChat=null;$('chat').style.display='none'}
async function loadChat(){if(!currentChat)return;try{let d=await api('/api/chat/'+currentChat);$('chatBody').innerHTML=d.messages.length?d.messages.map(m=>`<div class="bubble ${m.sender_id===me.telegram_id?'me':''}"><small>${esc(m.sender)} • ${esc(m.created_at||'')}</small>${esc(m.text)}</div>`).join(''):'<div class="empty">💬 Hali xabar yo‘q.<br>Birinchi bo‘lib yozing.</div>';$('chatBody').scrollTop=$('chatBody').scrollHeight}catch(e){toast(e.message)}}
async function sendChat(){let inp=$('chatInput'),text=inp.value.trim();if(!text||!currentChat)return;try{await api('/api/chat/'+currentChat,{method:'POST',body:JSON.stringify({text})});inp.value='';loadChat()}catch(e){toast(e.message)}}

async function showAdmin(){['games','teams','standings','results'].forEach(x=>$(x).classList.add('hidden'));$('admin').classList.remove('hidden');document.querySelectorAll('#mainNav button').forEach(b=>b.classList.remove('active'));await renderAdmin()}
async function renderAdmin(){let [s,us,rs,ms,ts]=await Promise.all([api('/api/admin/summary'),api('/api/admin/users'),api('/api/admin/rounds'),api('/api/admin/matches'),api('/api/teams')]);$('admin').innerHTML=`<div class="sectionTitle"><h2>👑 Admin panel</h2><span class="muted">Boshqaruv</span></div><div class="card"><b>📊 ${s.participants}</b> ishtirokchi • <b>${s.rounds}</b> tur • <b>${s.matches}</b> o‘yin • deadline <b>${s.deadline}</b></div><div class="card"><h3>👥 Ishtirokchi qo‘shish</h3><div class="form"><label>Telegram ID</label><input id="a_tid" type="number"><label>Username (@sizsiz ham bo‘ladi)</label><input id="a_user"><label>Ism</label><input id="a_name"><label>Jamoa</label><select id="a_team"><option value="">Jamoasiz</option>${ts.map(t=>`<option value="${t.id}" ${t.taken?'disabled':''}>${esc(t.name)} ${t.taken?'🔒':''}</option>`).join('')}</select><button class="btn primary" onclick="adminAddUser()">➕ Qo‘shish / yangilash</button></div></div><div class="card"><h3>⏰ Deadline</h3><div class="adminRow"><input id="deadlineInput" value="${esc(s.deadline)}" placeholder="23:30"><button class="btn primary" onclick="adminDeadline()">Saqlash</button></div></div><div class="card"><h3>📅 Turlar</h3><p class="muted">Avtomatik ravishda har kuni 2 ta tur yaratiladi. Deadline 23:30.</p><div class="adminRow"><input id="startDate" type="date"><button class="btn primary" onclick="generateRounds()">⚡ Turlarni yaratish</button><button class="btn danger" onclick="startNextSeason()">🆕 Yangi mavsumni boshlash</button></div><div class="adminBlock">${rs.length?rs.map(r=>`<div class="card" style="margin:7px 0"><b>${r.round_no}-TUR</b> • ${r.round_date} • ${r.match_count} o‘yin <span class="status ${r.status==='closed'?'s-red':'s-green'}">${r.status}</span><div class="adminRow" style="margin-top:7px"><button class="btn" onclick="roundAction(${r.id},'open')">Ochish</button><button class="btn" onclick="roundAction(${r.id},'close')">Yopish</button><button class="btn danger" onclick="deleteRound(${r.id})">O‘chirish</button></div></div>`).join(''):'<div class="empty">Hali tur yaratilmagan.</div>'}</div></div><div class="card"><h3>👤 Ishtirokchilar</h3>${us.map(u=>`<div class="card" style="margin:7px 0"><b>${esc(u.first_name||'Foydalanuvchi')}</b> ${u.username?'(@'+esc(u.username)+')':''}<div class="tiny">ID: ${u.telegram_id} • ${u.active?'Faol':'O‘chirilgan'}</div><div class="adminRow" style="margin-top:7px"><select id="u-${u.telegram_id}">${ts.map(t=>`<option value="${t.id}" ${u.team_id==t.id?'selected':''}>${esc(t.name)} ${t.taken&&u.team_id!=t.id?'🔒':''}</option>`).join('')}</select><button class="btn" onclick="changeTeam(${u.telegram_id})">Jamoani saqlash</button><button class="btn danger" onclick="removeUser(${u.telegram_id})">O‘chirish</button></div></div>`).join('')||'<div class="empty">Ishtirokchilar yo‘q.</div>'}</div><div class="card"><h3>⚽ O‘yinlar va natijalar</h3>${ms.map(m=>`<div class="card" style="margin:7px 0"><b>${m.round_no}-TUR</b> • #${m.id}<br>${esc(m.home_name)} <b>${m.home_goals}:${m.away_goals}</b> ${esc(m.away_name)}<div class="tiny">${m.status} • ${m.round_date}</div><div class="adminRow" style="margin-top:7px"><input id="hg-${m.id}" type="number" min="0" value="${m.home_goals}"><input id="ag-${m.id}" type="number" min="0" value="${m.away_goals}"><input id="tm-${m.id}" type="datetime-local" value="${m.scheduled_at||''}"><button class="btn primary" onclick="adminScore(${m.id})">Saqlash</button><button class="btn danger" onclick="adminDeleteMatch(${m.id})">O‘chirish</button></div></div>`).join('')||'<div class="empty">O‘yinlar yo‘q.</div>'}</div>`}
async function adminAddUser(){try{await api('/api/admin/user',{method:'POST',body:JSON.stringify({telegram_id:Number($('a_tid').value),username:$('a_user').value,first_name:$('a_name').value,team_id:$('a_team').value||null})});toast('✅ Ishtirokchi saqlandi');renderAdmin()}catch(e){toast(e.message)}}
async function adminDeadline(){try{await api('/api/admin/deadline',{method:'POST',body:JSON.stringify({deadline:$('deadlineInput').value})});toast('⏰ Deadline saqlandi');renderAdmin()}catch(e){toast(e.message)}}
async function startNextSeason(){
if(!confirm('Yangi mavsum boshlansinmi? Eski mavsum o‘yinlari va turlari o‘chadi. Ishtirokchilar va jamoalar saqlanadi.'))return;
try{
let d=await api('/api/admin/start_next_season',{method:'POST'});
toast('✅ '+d.season+'-mavsum boshlandi');
renderAdmin();
}catch(e){toast(e.message)}
}
async function generateRounds(){let d=$('startDate').value||new Date().toISOString().slice(0,10);if(!confirm('Faol jamoalar asosida barcha turlar yaratiladi. Davom etasizmi?'))return;try{let x=await api('/api/admin/generate_rounds',{method:'POST',body:JSON.stringify({start_date:d})});toast(`✅ ${x.rounds_created} ta tur yaratildi`);renderAdmin()}catch(e){toast(e.message)}}
async function roundAction(id,a){try{await api('/api/admin/round/action',{method:'POST',body:JSON.stringify({round_id:id,action:a})});renderAdmin()}catch(e){toast(e.message)}}
async function deleteRound(id){if(!confirm('Bu tur va ichidagi o‘yinlar o‘chadi. Davom etasizmi?'))return;try{await api('/api/admin/round/delete',{method:'POST',body:JSON.stringify({round_id:id})});renderAdmin()}catch(e){toast(e.message)}}
async function changeTeam(id){try{await api('/api/admin/user/team',{method:'POST',body:JSON.stringify({telegram_id:id,team_id:Number($('u-'+id).value)})});toast('✅ Jamoa o‘zgartirildi');renderAdmin()}catch(e){toast(e.message)}}
async function removeUser(id){if(!confirm('Ishtirokchini o‘chirasizmi?'))return;try{await api('/api/admin/user/remove',{method:'POST',body:JSON.stringify({telegram_id:id})});toast('O‘chirildi');renderAdmin()}catch(e){toast(e.message)}}
async function adminScore(id){try{await api('/api/admin/match/update',{method:'POST',body:JSON.stringify({match_id:id,home_goals:Number($('hg-'+id).value),away_goals:Number($('ag-'+id).value),scheduled_at:$('tm-'+id).value||null})});toast('✅ Natija saqlandi');renderAdmin()}catch(e){toast(e.message)}}
async function adminDeleteMatch(id){if(!confirm('O‘yin o‘chadi.'))return;try{await api('/api/admin/match/delete',{method:'POST',body:JSON.stringify({match_id:id})});renderAdmin()}catch(e){toast(e.message)}}

loadMe();
</script>
