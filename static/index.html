<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>eFootball La Liga</title>
<style>
:root{--bg:#071015;--card:#101b22;--line:#263842;--text:#eef6f8;--muted:#93a4ac;--gold:#f3c44e;--silver:#c6cbd0;--bronze:#d48a50;--green:#20b66d;--blue:#68b8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.hero{background:linear-gradient(135deg,#101d28,#171126)}h1,h2,h3,p{margin:5px 0}.muted,small{color:var(--muted)}.nav{display:flex;gap:7px;overflow:auto;margin:10px 0;padding-bottom:2px}.nav button,button{border:1px solid var(--line);background:#14232b;color:white;border-radius:12px;padding:10px;white-space:nowrap;cursor:pointer}.nav .active,.primary{background:var(--green);border-color:var(--green);color:#062014;font-weight:bold}.danger{background:#54222a}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.teamcard{background:#0b151b;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.teamcard img{width:50px;height:50px;object-fit:contain}.match{padding:11px;border-bottom:1px solid var(--line)}.match:last-child{border:0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.score{font-size:22px;font-weight:bold;color:var(--gold)}input{width:100%;padding:10px;border-radius:10px;background:#091319;border:1px solid var(--line);color:white;margin:4px 0}.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.actions button{flex:1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:7px;border-bottom:1px solid var(--line);text-align:center}.club{display:flex;align-items:center;gap:5px;text-align:left}.club img,.logo{width:28px;height:28px;object-fit:contain}.tag{padding:3px 7px;border-radius:8px;background:#24333b;color:#b7d0d8;font-size:11px}.gold{color:var(--gold)}.center{text-align:center}.round{margin-bottom:10px}.profileCard{cursor:pointer}.profileHead{display:flex;align-items:center;gap:12px}.profileHead img{width:70px;height:70px;object-fit:contain}.cups{display:flex;gap:8px;margin:12px 0}.cupbox{flex:1;text-align:center;padding:10px;background:#0b151b;border:1px solid var(--line);border-radius:14px}.cupnum{font-size:25px;font-weight:bold}.winner{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.winner:last-child{border:0}.winner img{width:42px;height:42px;object-fit:contain}.click{cursor:pointer;color:var(--blue)}
</style></head><body><div class="wrap">
<div class="hero"><h1>⚽ eFootball La Liga</h1><p class="muted">20 jamoa • 38 tur • Uy/Safar • Deadline 23:30</p><div id="me" class="tag">Yuklanmoqda...</div></div>
<div class="nav">
<button class="active" onclick="go('home',this)">Bosh sahifa</button>
<button onclick="go('games',this)">Mening o'yinlarim</button>
<button onclick="go('table',this)">Jadval</button>
<button onclick="go('schedule',this)">Taqvim</button>
<button onclick="go('teams',this)">Jamoalar</button>
<button onclick="go('participants',this)">Ishtirokchilar</button>
<button onclick="go('profile',this)">👤 Profilim</button>
<button onclick="go('winners',this)">🏆 Sovrindorlar</button>
<button onclick="go('tops',this)">To'purarlar</button>
<button onclick="go('rules',this)">Qoidalar</button>
<button id="adminBtn" class="hidden" onclick="go('admin',this)">👑 Admin</button>
</div><div id="app"></div></div>
<script>
const tg=window.Telegram?.WebApp||{initData:'',ready(){},expand(){}};tg.ready();tg.expand();let ME=null,ADMIN=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&gt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData||''};let r=await fetch(u,o),d=await r.json().catch(()=>({error:'Server xatosi'}));if(!r.ok)throw Error(d.error||'Xatolik');return d}
function go(x,b){document.querySelectorAll('.nav button').forEach(z=>z.classList.remove('active'));if(b)b.classList.add('active');({home,games,table,schedule,teams,participants,profile,winners,tops,rules,admin:adminPanel}[x])()}
async function init(){try{let d=await api('/api/me');ME=d.user;ADMIN=d.is_admin;document.getElementById('me').textContent=`👤 ${ME.first_name||''} ${ME.username?'@'+ME.username:''} • ${ME.team_name||'Jamoa tanlanmagan'}`;document.getElementById('adminBtn').classList.toggle('hidden',!ADMIN);home()}catch(e){document.getElementById('app').innerHTML='<div class=card>Telegram Mini App ichidan oching: '+esc(e.message)+'</div>'}}
async function home(){let [s,t,si,w]=await Promise.all([api('/api/standings'),api('/api/top-scorers'),api('/api/season'),api('/api/season/winners')]);let winnersHtml=si.finished?winnerList(w.winners):`<p class=muted>🏁 Mavsum hali tugamagan. 38-tur yakunlangandan keyin haqiqiy 1, 2 va 3-o'rin egalari shu yerda ko'rsatiladi.</p>`;document.getElementById('app').innerHTML=`<div class=card><h2>🏆 ${si.season}-mavsum</h2><p>Joriy lider: <b>${esc(s[0]?.name||'—')}</b> • ${s[0]?.points||0} ochko</p><p>⚽ Eng ko'p gol: <b>${esc(t[0]?.name||'—')}</b> (${t[0]?.goals||0})</p><p class=muted>${si.finished?'Mavsum yakunlangan':'38 tur tugagach mavsum avtomatik yakunlanadi.'}</p></div><div class=card><h3>🥇🥈🥉 Sovrindorlar</h3>${winnersHtml}</div>`}
function winnerList(list){if(!list?.length)return '<p class=muted>Sovrindorlar hali aniqlanmagan.</p>';let icons=['🥇','🥈','🥉'];return list.map(x=>`<div class=winner click onclick="openProfile(${x.telegram_id})"><span style="font-size:25px">${icons[x.place-1]}</span>${x.logo?`<img src="${x.logo}">`:''}<span><b>${esc(x.team||'Jamoa')}</b><br><small>${x.username?'@'+esc(x.username):esc(x.name)}</small></span></div>`).join('')}
async function games(){let d=await api('/api/my_matches');let ms=d.matches||[];document.getElementById('app').innerHTML='<h2>Mening o\'yinlarim</h2>'+(ms.length?ms.map(m=>`<div class=card><div class=row><b>${m.round_no}-tur</b><span class=tag>${m.round_date} • ${m.deadline}</span></div><div class=row><span>${esc(m.home)}</span><b class=score>${m.status==='scheduled'?'VS':m.status==='pending'?m.pending_home_goals+':'+m.pending_away_goals:m.home_goals+':'+m.away_goals}</b><span>${esc(m.away)}</span></div>${m.status==='scheduled'?`<div class=row><input id=h${m.id} type=number min=0 placeholder="Uy gol"><input id=a${m.id} type=number min=0 placeholder="Mehmon gol"></div><div class=actions><button class=primary onclick="submit(${m.id})">⚽ Natijani yuborish</button></div>`:''}${m.status==='pending'&&m.can_confirm?`<div class=actions><button class=primary onclick="confirmR(${m.id})">✅ Tasdiqlash</button><button onclick="rejectR(${m.id})">❌ Rad etish</button></div>`:''}<p class=muted>Holat: ${m.status==='auto'?'Deadline avtomatik tasdiqladi':m.status}</p></div>`).join(''):'<div class=card>Hali o\'yin yo\'q. Avval jamoa tanlang yoki admin turlarni yaratsin.</div>')}
async function submit(id){try{let h=document.getElementById('h'+id).value,a=document.getElementById('a'+id).value;if(h===''||a==='')throw Error('Ikkala hisobni ham kiriting');await api('/api/result/submit',{method:'POST',body:JSON.stringify({match_id:id,home_goals:+h,away_goals:+a})});games()}catch(e){alert(e.message)}}
async function confirmR(id){try{await api('/api/result/confirm',{method:'POST',body:JSON.stringify({match_id:id})});games()}catch(e){alert(e.message)}}async function rejectR(id){try{await api('/api/result/reject',{method:'POST',body:JSON.stringify({match_id:id})});games()}catch(e){alert(e.message)}}
async function table(){let d=await api('/api/standings');document.getElementById('app').innerHTML=`<h2>🏆 Turnir jadvali</h2><div class="card table"><table><tr><th>#</th><th>Jamoa / Ishtirokchi</th><th>O</th><th>G</th><th>D</th><th>M</th><th>UG</th><th>OG</th><th>+/-</th><th>Ochko</th></tr>${d.map(x=>`<tr><td>${x.rank}</td><td>${x.owner_id?`<div class="club click" onclick="openProfile(${x.owner_id})">`:'<div class=club>'}<img src="${x.logo}"><span>${esc(x.name)}<br><small>${x.owner?'@'+esc(x.owner):'—'}</small></span></div></td><td>${x.played}</td><td>${x.wins}</td><td>${x.draws}</td><td>${x.losses}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd}</td><td><b>${x.points}</b></td></tr>`).join('')}</table></div><p class=muted>Ishtirokchi ustiga bosib uning profilini ko'rishingiz mumkin.</p>`}
async function schedule(){let d=await api('/api/schedule');document.getElementById('app').innerHTML='<h2>📅 To\'liq 38 turlik taqvim</h2>'+d.map(r=>`<div class="card round"><b>${r.round_no}-TUR</b> <span class=muted>${r.round_date} • ${r.deadline}</span>${r.matches.map(m=>`<div class=match><div class=row><span>${esc(m.home)}</span><b>${m.status==='scheduled'?'—':m.home_goals+':'+m.away_goals}</b><span>${esc(m.away)}</span></div></div>`).join('')}</div>`).join('')}
async function teams(){let d=await api('/api/teams');document.getElementById('app').innerHTML=`<h2>⚽ La Liga jamoalari</h2><div class=grid>${d.map(x=>`<div class=teamcard><img src="${x.logo}"><b>${esc(x.name)}</b><small>${x.taken?'@'+esc(x.owner||'Band'):'🟢 Bo\'sh'}</small>${!ME.team_id&&!x.taken?`<button class=primary onclick="join(${x.id})">Tanlash</button>`:''}</div>`).join('')}</div>`}
async function join(id){try{await api('/api/join',{method:'POST',body:JSON.stringify({team_id:id})});location.reload()}catch(e){alert(e.message)}}
async function participants(){let d=await api('/api/participants');document.getElementById('app').innerHTML=`<h2>👥 Ishtirokchilar</h2><p class=muted>Har bir ishtirokchi profilini ochib natijalari va yutuqlarini ko'rishingiz mumkin.</p>${d.map(x=>`<div class="card profileCard" onclick="openProfile(${x.telegram_id})"><div class=profileHead>${x.logo?`<img src="${x.logo}">`:''}<div><h3>${esc(x.team_name||'Jamoasiz')}</h3><p>${x.username?'@'+esc(x.username):esc(x.first_name||'Ishtirokchi')}</p><small>🥇 ${x.cups['1']} • 🥈 ${x.cups['2']} • 🥉 ${x.cups['3']}</small></div></div></div>`).join('')||'<div class=card>Hali ishtirokchilar yo\'q.</div>'}`}
async function profile(){if(!ME)return;openProfile(ME.telegram_id,true)}
async function openProfile(id,isMine=false){
try{
const d=await api('/api/profile_full/'+id),u=d.user||{},st=d.stats||{},c=d.cups||{},ms=d.matches||[];
const back=isMine?'profile()':'participants()';
const logo=d.logo?'<img src="'+esc(d.logo)+'">':'';
const name=u.username?'@'+esc(u.username):esc(u.first_name||'Ishtirokchi');
const mh=ms.length?ms.map(m=>'<div class="match"><small>'+m.round_no+'-tur • '+esc(m.round_date||'')+'</small><div class="row"><span>'+esc(m.home)+'</span><b class="score">'+(m.status==='scheduled'?'VS':((m.home_goals??0)+':'+(m.away_goals??0)))+'</b><span>'+esc(m.away)+'</span></div></div>').join(''):'<p class="muted">Hali o\'yin natijalari yo\'q.</p>';
document.getElementById('app').innerHTML='<button onclick="'+back+'">← Orqaga</button><div class="card"><div class="profileHead">'+logo+'<div><h2>'+esc(u.team_name||'Jamoasiz')+'</h2><p>'+name+'</p></div></div><div class="cups"><div class="cupbox">🥇 <b>'+(c['1']||0)+'</b><small> 1-o\'rin</small></div><div class="cupbox">🥈 <b>'+(c['2']||0)+'</b><small> 2-o\'rin</small></div><div class="cupbox">🥉 <b>'+(c['3']||0)+'</b><small> 3-o\'rin</small></div></div><h3>📊 Joriy statistika</h3><p>O\'yin: '+(st.played||0)+' • G\'alaba: '+(st.wins||0)+' • Durang: '+(st.draws||0)+' • Mag\'lubiyat: '+(st.losses||0)+'</p><p>UG: '+(st.gf||0)+' • OG: '+(st.ga||0)+' • Ochko: '+(st.points||0)+'</p></div><div class="card"><h3>📅 O\'yin natijalari</h3>'+mh+'</div>';
}catch(e){document.getElementById('app').innerHTML='<div class="card">Profil xatosi: '+esc(e.message)+'</div>'}
}
async function winners(){let d=await api('/api/season/winners');document.getElementById('app').innerHTML=`<h2>🏆 ${d.season}-mavsum sovrindorlari</h2><div class=card>${d.finished?winnerList(d.winners):'<p class=muted>Mavsum hali tugamagan. 38 tur tugagandan keyin yakuniy 1, 2 va 3-o\'rin egalari ko\'rsatiladi.</p>'}</div><p class=muted>Bu bo'limda ochko emas, faqat mavsum yakunida haqiqiy sovrindorlar saqlanadi.</p>`}
async function tops(){let d=await api('/api/top-scorers');document.getElementById('app').innerHTML='<h2>⚽ Eng ko\'p gol urgan jamoalar</h2><div class=card>'+d.map(x=>`<div class="row match"><span>${x.rank}. <img class=logo src="${x.logo}"> ${esc(x.name)}</span><b class=gold>${x.goals} gol</b></div>`).join('')+'</div>'}
function rules(){document.getElementById('app').innerHTML=`<div class=card><h2>📜 Liga qoidalari</h2><ol><li>O'yin 8 daqiqa.</li><li>Penaltilar seriyasi va Extra Time yoqilmaydi.</li><li>Raqiblar Telegram orqali o'yin vaqtini kelishib olishadi.</li><li>Raqib javob bermasa, screenshot bilan admin ga isbot beriladi.</li><li>Admin tekshiruvdan keyin 3:0 texnik mag'lubiyat berishi mumkin.</li><li>Aldagan yoki soxta isbot bergan ishtirokchi ligadan chetlatiladi.</li><li>Har kuni deadline — 23:30.</li><li>Hech kim natija kiritmasa 0:0 avtomatik tasdiqlanadi.</li><li>Bir tomon natija kiritgan bo'lsa, deadline'da aynan o'sha natija avtomatik tasdiqlanadi.</li><li>38 tur tugagach mavsum yakunlanadi. Yangi mavsumni faqat admin boshlaydi.</li><li>Ochko teng bo'lsa gollar nisbatiga qaraladi.</li></ol></div>`}
async function adminPanel(){
if(!ADMIN)return;
try{
const data=await Promise.all([api('/api/admin/summary'),api('/api/admin/users'),api('/api/admin/matches')]);
const s=data[0],u=data[1],m=data[2];
let matchHtml=m.length?m.map(x=>{
return '<div class="match"><b>'+x.round_no+'-tur</b><div class="row"><span>'+esc(x.home)+'</span><input id="ah'+x.id+'" type="number" min="0" value="'+(x.home_goals??0)+'" style="max-width:70px"><b>:</b><input id="aa'+x.id+'" type="number" min="0" value="'+(x.away_goals??0)+'" style="max-width:70px"><span>'+esc(x.away)+'</span></div><button class="primary" onclick="adminUpdateMatch('+x.id+')">💾 Natijani saqlash</button></div>';
}).join(''):'<p class="muted">Hali o\'yinlar yo\'q.</p>';
let userHtml=u.map(x=>'<div class="match"><b>'+esc(x.first_name||'')+'</b> '+(x.username?'@'+esc(x.username):'')+' • '+esc(x.team_name||'Jamoasiz')+' <button class="danger" onclick="removeUser('+x.telegram_id+')">Chiqarish</button></div>').join('');
document.getElementById('app').innerHTML='<div class="card"><h2>👑 Admin panel</h2><p>'+s.participants+'/20 ishtirokchi • '+s.rounds+'/38 tur • '+s.matches+' o\'yin</p><input id="sd" type="date"><button class="primary" onclick="gen()">38 turni yaratish</button><button onclick="nextSeason()">🆕 Yangi mavsumni boshlash</button></div><div class="card"><h3>✏️ Natijalarni o\'zgartirish</h3>'+matchHtml+'</div><div class="card"><h3>Ishtirokchilar</h3>'+userHtml+'</div>';
}catch(e){document.getElementById('app').innerHTML='<div class="card">Admin panel xatosi: '+esc(e.message)+'</div>'}
}
async function adminUpdateMatch(id){try{let h=document.getElementById('ah'+id).value,a=document.getElementById('aa'+id).value;if(h===''||a==='')throw Error('Ikkala golni ham kiriting');await api('/api/admin/match/update',{method:'POST',body:JSON.stringify({match_id:id,home_goals:+h,away_goals:+a})});alert('Natija saqlandi');adminPanel()}catch(e){alert(e.message)}}
async function gen(){try{let start=document.getElementById('sd').value||new Date().toISOString().slice(0,10);let d=await api('/api/admin/generate_rounds',{method:'POST',body:JSON.stringify({start_date:start})});alert(d.rounds_created+' tur yaratildi');adminPanel()}catch(e){alert(e.message)}}async function removeUser(id){await api('/api/admin/user/remove',{method:'POST',body:JSON.stringify({telegram_id:id})});adminPanel()}async function nextSeason(){if(confirm('Yangi mavsum uchun eski o\'yinlar jadvali tozalanadi.')){await api('/api/admin/start_next_season',{method:'POST'});adminPanel()}}
init();
</script></body></html>
