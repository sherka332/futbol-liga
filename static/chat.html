<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Shaxsiy chat</title><style>
:root{--bg:#071015;--card:#101b22;--line:#263842;--text:#eef6f8;--muted:#93a4ac;--green:#20b66d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.head img{width:45px;height:45px;object-fit:contain}.back,button{border:1px solid var(--line);background:#14232b;color:white;border-radius:12px;padding:10px;cursor:pointer}.messages{height:calc(100vh - 210px);min-height:350px;overflow:auto;padding:8px 2px}.msg{max-width:78%;padding:10px 12px;border-radius:15px;margin:7px 0;word-break:break-word;background:#17242c}.mine{margin-left:auto;background:#17633f}.time{display:block;color:#b9c6cc;font-size:10px;margin-top:4px}.send{display:flex;gap:7px;margin-top:8px}.send input{flex:1;padding:12px;border-radius:12px;background:#091319;border:1px solid var(--line);color:white}.primary{background:var(--green);border-color:var(--green);color:#062014;font-weight:bold}.muted{color:var(--muted)}
</style></head><body><div class="wrap"><button class="back" onclick="history.back()">← Orqaga</button><div class="card" style="margin-top:10px"><div class="head" id="head"><b>Chat yuklanmoqda...</b></div><div class="messages" id="messages"></div><div class="send"><input id="text" maxlength="1000" placeholder="Xabar yozing..." autocomplete="off"><button class="primary" onclick="sendMsg()">Yuborish</button></div></div></div>
<script>
const tg=window.Telegram?.WebApp||{initData:'',ready(){},expand(){}};tg.ready();tg.expand();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData||''};let r=await fetch(u,o),d=await r.json().catch(()=>({error:'Server xatosi'}));if(!r.ok)throw Error(d.error||'Xatolik');return d}
const otherId=new URLSearchParams(location.search).get('user_id');let myId=null,lastCount=-1;
async function load(silent=false){try{if(!otherId)throw Error('Ishtirokchi tanlanmagan');const me=await api('/api/me');myId=me.user.telegram_id;const d=await api('/api/dm/'+encodeURIComponent(otherId));const t=d.target||{};document.getElementById('head').innerHTML=(t.logo?'<img src="'+esc(t.logo)+'">':'')+'<div><b>'+esc(t.team_name||'Jamoasiz')+'</b><div class="muted">'+(t.username?'@'+esc(t.username):esc(t.first_name||'Ishtirokchi'))+'</div></div>';const box=document.getElementById('messages');const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-40;box.innerHTML=(d.messages||[]).map(m=>'<div class="msg '+(String(m.sender_id)===String(myId)?'mine':'')+'>'+esc(m.text)+'<span class="time">'+esc(m.created_at||'')+'</span></div>').join('')||'<p class="muted">Hali xabar yo‘q. Birinchi bo‘lib yozing 👋</p>';if(!silent||atBottom||lastCount!==d.messages.length)box.scrollTop=box.scrollHeight;lastCount=d.messages.length}catch(e){if(!silent)document.getElementById('messages').innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
async function sendMsg(){const inp=document.getElementById('text'),text=inp.value.trim();if(!text)return;try{await api('/api/dm/'+encodeURIComponent(otherId),{method:'POST',body:JSON.stringify({text})});inp.value='';await load()}catch(e){alert(e.message)}}
document.getElementById('text').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMsg()}});load();setInterval(()=>load(true),3000);
</script></body></html>
